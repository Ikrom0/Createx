<div class="{{ project.category }} projects__card">
  <img src="{{ project.card_img | image_url }}"
    alt="" class="projects__card-img"/>
  <footer class="projects__card-footer">
      <h3 class="projects__card-title">{{ project.title }}</h3>
      <p class="projects__card-subtitle">{{ project.subtitle }}</p>
      <a href="{{ url_for('project', slug=project.slug) }}" class="btn btn--sm btn--clear">View Project</a>
  </footer>
</div>
