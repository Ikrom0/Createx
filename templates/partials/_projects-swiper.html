<section class="projects {{ projects_mod }}">
  <div class="container">
    <header class="section-header projects__header">
      <h2 class="projects__title">{{ projects_title }}</h2>
      <div class="slider-controls projects__controls">
        <button type="button" class="slider-btn slider-btn--prev" aria-label="Previous project" aria-controls="projects-slider">
          <svg aria-hidden="true" width="18" height="12">
            <use href="#icon-btn-prev"></use>
          </svg>
        </button>
        <button type="button" class="slider-btn slider-btn--next" aria-label="Next project" aria-controls="projects-slider">
          <svg aria-hidden="true" width="18" height="12">
            <use href="#icon-btn-next"></use>
          </svg>
        </button>
      </div>
    </header>
    <div class="swiper projects__slider" id="projects-slider">
      <div class="swiper-wrapper">
        {% for project in projects %}
        <div class="swiper-slide">
          {% include "partials/_projects-card.html" %}
        </div>
        {% endfor %}
      </div>
      <div class="swiper-pagination projects__pagination"></div>
    </div>
    <div class="explore-more">
      <h3>Explore all our works</h3>
      <a href="{{ url_for('work') }}" class="btn btn--md btn--filled">View portfolio</a>
    </div>
  </div>
</section>
