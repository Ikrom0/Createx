<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="http://localhost:5173/src/js/main.js"></script>
  <title>Page not found</title>
</head>
<body>
  <section class="error-page">
    <div class="container">
      <h1 class="error-page__code">404</h1>
      <h2 class="error-page__title">Page not found</h2>
      <p class="error-page__text">The page you are looking for doesn't exist or has been moved.</p>
      <a
        href="{{ url_for('admin.dashboard') if is_admin else url_for('home') }}"
        class="btn btn--clear btn--sm"
      >
        Go Homepage
      </a>
    </div>
  </section>
</body>
</html>
